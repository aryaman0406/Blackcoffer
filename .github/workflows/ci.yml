name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck, Test, E2E & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run automated unit & component tests
        run: npm run test

      - name: Seed Database
        run: npm run seed --workspace=@dashboard/backend
        env:
          MONGODB_URI: mongodb://localhost:27017/blackcoffer_dashboard

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Backend Server
        run: npm run dev --workspace=@dashboard/backend &
        env:
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/blackcoffer_dashboard
          CORS_ORIGIN: http://localhost:5173

      - name: Start Frontend Server
        run: npm run dev --workspace=@dashboard/frontend &

      - name: Run Playwright E2E Tests (Canvas Stability & Filter Toggles)
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      - name: Upload Playwright Test Artifacts (if failed)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Build applications
        run: npm run build
