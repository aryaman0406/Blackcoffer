services:
  - type: web
    name: blackcoffer-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build && npm prune --production
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        fromSecret: mongodb_uri
      - key: CORS_ORIGIN
        value: https://your-frontend-url.onrender.com
    rootDir: backend

  - type: static
    name: blackcoffer-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://blackcoffer-backend.onrender.com/api
